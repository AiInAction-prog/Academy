name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint bot and tools
        run: |
          flake8 bot/ tools/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Import smoke test
        run: |
          python -c "from bot.main import main; from bot.backtest import run_backtest, run_vwap_trend_backtest"
